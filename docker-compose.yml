services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - lifemap-net

  # La imagen oficial de Spark ignora SPARK_MODE: el rol se elige con el comando.
  # La misma imagen (spark_batch/Dockerfile, con el MongoDB Spark Connector) sirve al
  # maestro, al worker y a los jobs.
  spark-master:
    build: ./spark_batch
    image: lifemap-spark:latest
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8081:8080"   # 8080 lo usa Jenkins
      - "7077:7077"
    networks:
      - lifemap-net

  spark-worker:
    build: ./spark_batch
    image: lifemap-spark:latest
    container_name: spark-worker
    hostname: spark-worker
    user: root   # escribe modelos y resultados en volúmenes compartidos con el driver
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=3g
      - SPARK_WORKER_CORES=2
    volumes:
      - spark_models:/app/models
      - spark_output:/app/output
    depends_on:
      - spark-master
    networks:
      - lifemap-net

  # Jobs batch de Spark (no arrancan con `up`): se lanzan con
  #   docker compose --profile jobs run --rm spark-jobs spark-submit /app/<job>.py
  spark-jobs:
    build: ./spark_batch
    image: lifemap-spark:latest
    profiles: ["jobs"]
    user: root
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - SPARK_MASTER_URL=spark://spark-master:7077
      - GEOHASH_PRECISION=6
      - MIN_BUSINESS_DAYS=3650
    volumes:
      - spark_models:/app/models
      - spark_output:/app/output
    depends_on:
      - mongodb
      - spark-master
      - spark-worker
    networks:
      - lifemap-net

  dask-scheduler:
    image: daskdev/dask:latest
    container_name: dask-scheduler
    command: dask-scheduler
    ports:
      - "8786:8786"
      - "8787:8787"
    networks:
      - lifemap-net

  dask-worker-1:
    image: daskdev/dask:latest
    container_name: dask-worker-1
    command: dask-worker dask-scheduler:8786
    depends_on:
      - dask-scheduler
    networks:
      - lifemap-net

  dask-worker-2:
    image: daskdev/dask:latest
    container_name: dask-worker-2
    command: dask-worker dask-scheduler:8786
    depends_on:
      - dask-scheduler
    networks:
      - lifemap-net

  api:
    build: ./api_flask
    container_name: flask-api
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/lifemap_db
    depends_on:
      - mongodb
    networks:
      - lifemap-net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lifemap-net

volumes:
  mongo_data:
    driver: local
  jenkins_home:
    driver: local
  spark_models:
    driver: local
  spark_output:
    driver: local

networks:
  lifemap-net:
    driver: bridge
