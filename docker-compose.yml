services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - lifemap-net

  spark-master:
    image: apache/spark:latest
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - lifemap-net

  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - lifemap-net

  dask-scheduler:
    image: daskdev/dask:latest
    container_name: dask-scheduler
    command: dask-scheduler
    ports:
      - "8786:8786"
      - "8787:8787"
    networks:
      - lifemap-net

  dask-worker-1:
    image: daskdev/dask:latest
    container_name: dask-worker-1
    command: dask-worker dask-scheduler:8786
    depends_on:
      - dask-scheduler
    networks:
      - lifemap-net

  dask-worker-2:
    image: daskdev/dask:latest
    container_name: dask-worker-2
    command: dask-worker dask-scheduler:8786
    depends_on:
      - dask-scheduler
    networks:
      - lifemap-net

  api:
    build: ./api_flask
    container_name: flask-api
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/lifemap_db
    depends_on:
      - mongodb
    networks:
      - lifemap-net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lifemap-net

volumes:
  mongo_data:
    driver: local
  jenkins_home:
    driver: local

networks:
  lifemap-net:
    driver: bridge
