# Memoria: este PC tiene ~3,7 GB para Docker (WSL), así que `docker compose up` solo arranca lo que
# corre siempre (mongodb, api y, desde la Entrega 2, kafka). Spark y Dask están en perfiles y se arrancan solo para los jobs:
#   docker compose --profile jobs run --rm spark-jobs spark-submit /app/<job>.py   (arranca Spark)
#   docker compose stop spark-master spark-worker dask-scheduler dask-worker-1 dask-worker-2   (lo apaga al terminar;
#   sin nombres, `stop` apagaría también mongodb y api)
services:
  mongodb:
    image: mongo:latest
    # Por defecto MongoDB usa la mitad de la RAM libre como caché: se limita a 256 MB
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lifemap-net

  # La imagen oficial de Spark ignora SPARK_MODE: el rol se elige con el comando.
  # La misma imagen (spark_batch/Dockerfile, con el MongoDB Spark Connector) sirve al
  # maestro, al worker y a los jobs.
  spark-master:
    build: ./spark_batch
    image: lifemap-spark:latest
    profiles: ["batch", "jobs"]
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8081:8080"   # 8080 lo usa Jenkins
      - "7077:7077"
    networks:
      - lifemap-net

  spark-worker:
    build: ./spark_batch
    image: lifemap-spark:latest
    profiles: ["batch", "jobs"]
    hostname: spark-worker
    user: root   # escribe modelos y resultados en volúmenes compartidos con el driver
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      # Memoria que el worker da a los ejecutores. Para un job pesado: SPARK_WORKER_MEMORY=2g docker compose ...
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-1g}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
    volumes:
      - spark_models:/app/models
      - spark_output:/app/output
    depends_on:
      - spark-master
    networks:
      - lifemap-net

  # Jobs batch de Spark (no arrancan con `up`): se lanzan con
  #   docker compose --profile jobs run --rm spark-jobs spark-submit /app/<job>.py
  spark-jobs:
    build: ./spark_batch
    image: lifemap-spark:latest
    profiles: ["jobs"]
    user: root
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - SPARK_MASTER_URL=spark://spark-master:7077
      # Leídas por spark-submit; el ejecutor debe caber en SPARK_WORKER_MEMORY
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-768m}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-768m}
      - GEOHASH_PRECISION=6
      - MIN_BUSINESS_DAYS=3650
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-reviews}
    ports:
      - "4040:4040"   # UI de la aplicación Spark; con `run` hace falta --service-ports
    volumes:
      - spark_models:/app/models
      - spark_output:/app/output
      - spark_checkpoints:/app/checkpoints   # checkpoints del streaming (offsets de Kafka)
    depends_on:
      - mongodb
      - spark-master
      - spark-worker
    networks:
      - lifemap-net

  # Valida el dataset de Yelp y lo descarga de Kaggle solo si falta o está incompleto.
  # `docker compose build` ya lo descarga dentro de la imagen (secrets de BuildKit con las variables
  # KAGGLE_API_TOKEN o KAGGLE_USERNAME + KAGGLE_KEY, del shell o de un .env local, nunca en git);
  # el volumen yelp_data se rellena con esos archivos la primera vez y `up` no descarga de nuevo.
  # YELP_DATA_DIR=./data/raw usa una carpeta local (no se rellena sola: descarga al arrancar).
  dataset:
    build:
      context: ./dask_ingestion
      secrets:
        - kaggle_api_token
        - kaggle_username
        - kaggle_key
    image: lifemap-ingest:latest
    command: python download.py
    restart: "no"
    environment:
      - KAGGLE_API_TOKEN=${KAGGLE_API_TOKEN:-}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
    volumes:
      - ${YELP_DATA_DIR:-yelp_data}:/data/raw
    networks:
      - lifemap-net

  # Ingesta del dataset completo a MongoDB con Dask. `docker compose up` la lanza al terminar
  # `dataset`; se omite si ya hay datos cargados (FORCE_INGEST=1 los recarga). Usa la imagen que
  # construye `dataset`.
  ingest:
    image: lifemap-ingest:latest
    command: python ingest.py
    restart: "no"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - FORCE_INGEST=${FORCE_INGEST:-0}
    volumes:
      - ${YELP_DATA_DIR:-yelp_data}:/data/raw:ro
    depends_on:
      dataset:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    networks:
      - lifemap-net

  # Punto 3: vida de cada negocio (días-negocio, evento, censura) y GeoJSON. Corre después de `ingest`
  # y antes de los jobs de Spark; se puede repetir sin dañar los datos:
  #   docker compose --profile jobs run --rm business-life
  business-life:
    image: lifemap-ingest:latest
    profiles: ["jobs"]
    command: python process_business_life.py
    restart: "no"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lifemap-net

  # Entrega 2: broker Kafka de un solo nodo en modo KRaft (broker y controlador, sin ZooKeeper).
  # Dentro de la red de Compose se usa kafka:9092; desde el host, localhost:9094.
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk   # UUID en base64 (22 caracteres), fijo para que el volumen sirva tras reiniciar
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # El topic `reviews` lo crea kafka-init con sus particiones; no se crean topics por accidente
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - lifemap-net

  # Crea el topic `reviews` (3 particiones; la clave de cada mensaje es business_id) y termina.
  # Se puede repetir: --if-not-exists no toca un topic que ya existe.
  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    command:
      - sh
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ${KAFKA_TOPIC:-reviews} --partitions ${KAFKA_PARTITIONS:-3} --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic ${KAFKA_TOPIC:-reviews}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - lifemap-net

  # Productor con reloj acelerado: publica en orden de fecha las reseñas desde la fecha de corte T
  # (CUTOFF_DATE de spark_batch/lifemap_common.py, la misma constante con la que se entrena: esas
  # reseñas no se usan para entrenar), a SPEED_DAYS días simulados cada SPEED_SECONDS segundos.
  #   docker compose --profile streaming run --rm producer
  producer:
    # Contexto = raíz del repo para copiar también spark_batch/lifemap_common.py (fecha de corte y
    # conexiones); kafka_streaming/Dockerfile.dockerignore deja en el contexto solo esos dos archivos
    build:
      context: .
      dockerfile: kafka_streaming/Dockerfile
    image: lifemap-producer:latest
    profiles: ["streaming"]
    restart: "no"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-reviews}
      - SPEED_DAYS=${SPEED_DAYS:-30}
      - SPEED_SECONDS=${SPEED_SECONDS:-10}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - lifemap-net

  dask-scheduler:
    image: daskdev/dask:latest
    profiles: ["batch"]
    command: dask-scheduler
    ports:
      - "8786:8786"
      - "8787:8787"
    networks:
      - lifemap-net

  dask-worker-1:
    image: daskdev/dask:latest
    profiles: ["batch"]
    command: dask-worker dask-scheduler:8786
    depends_on:
      - dask-scheduler
    networks:
      - lifemap-net

  dask-worker-2:
    image: daskdev/dask:latest
    profiles: ["batch"]
    command: dask-worker dask-scheduler:8786
    depends_on:
      - dask-scheduler
    networks:
      - lifemap-net

  api:
    build: ./api_flask
    image: lifemap-api:latest
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/lifemap_db
      - GIT_COMMIT=${GIT_COMMIT:-unknown}   # Jenkins lo define; /health lo devuelve
      - MODEL_PATH=/app/models/sentiment_best   # lo escribe spark_batch/sentiment_model.py
      - SPARK_DRIVER_MEMORY=512m   # Spark local de /predict: solo clasifica textos
    volumes:
      - spark_models:/app/models:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s   # crea los índices al arrancar
    networks:
      - lifemap-net

  # Interfaz web (React + TypeScript): mapa con las consultas geoespaciales y vista de los modelos de ML.
  # Es opcional y no arranca con `up`:  docker compose --profile frontend up -d frontend
  # Queda en http://localhost:3000 y reenvía /api a la API (variable API_UPSTREAM).
  frontend:
    build: ./frontend
    image: lifemap-frontend:latest
    profiles: ["frontend"]
    ports:
      - "3000:80"
    environment:
      - API_UPSTREAM=${FRONTEND_API_UPSTREAM:-http://api:5000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lifemap-net

# Solo se leen al construir la imagen del dataset (`docker compose build`)
secrets:
  kaggle_api_token:
    environment: KAGGLE_API_TOKEN
  kaggle_username:
    environment: KAGGLE_USERNAME
  kaggle_key:
    environment: KAGGLE_KEY

volumes:
  mongo_data:
    driver: local
  spark_models:
    driver: local
  spark_output:
    driver: local
  yelp_data:
    driver: local
  kafka_data:
    driver: local
  spark_checkpoints:
    driver: local

networks:
  lifemap-net:
    driver: bridge
